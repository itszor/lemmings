; libroger's settings for lemmings (beside it, as <program>.ini)

[crop]
; --crop: the rows of the 256-line screen to show (FIRST-LAST, or all),
; to start with and from when the code at an address first runs (in hex)

; the menu uses rows 16-231, a level's preview 32-223 and the level
; 16-223; the menu comes back between levels, so one crop for them all
rows = 16-231
